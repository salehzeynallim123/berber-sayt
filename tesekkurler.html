<!DOCTYPE html>
<html lang="az"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Təşəkkürlər — Ustad bərbərxanası</title><meta name="description" content="Təşəkkürlər — Ustad bərbərxanası, Bakı."><meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400;12..96,75..100,600;12..96,75..100,800&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%231E5866'/><text x='50' y='72' font-size='64' text-anchor='middle' font-family='Arial' font-weight='bold' fill='%23EDF1EF'>U</text></svg>">
<style>
  :root{--tile:#1E5866;--white:#EDF1EF;--grout:#C9D3D0;--brick:#A8362A;--ink:#1C2124;--soft:#56625F}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  body{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-optical-sizing:auto;background:var(--white);color:var(--ink);font-size:18px;line-height:1.55}
  a{color:inherit}
  :focus-visible{outline:3px solid var(--brick);outline-offset:3px}
  .wrap{max-width:1120px;margin:0 auto;padding:0 24px}
  h1,h2,h3{font-weight:800;line-height:1.02;font-stretch:80%}
  h2{font-size:clamp(34px,5vw,54px);margin-bottom:32px}
  p{max-width:62ch}
  .top{display:flex;justify-content:space-between;align-items:center;padding:18px 24px;font-size:16px}
  .top nav{display:flex;gap:26px}
  .top nav a{text-decoration:none;color:var(--soft)}
  .top nav a:hover{color:var(--ink);text-decoration:underline}
  .mark{font-weight:800;font-size:22px;text-decoration:none;font-stretch:80%}
  .call{font-weight:600;text-decoration:none}
  .hero{background-image:linear-gradient(var(--grout) 1px,transparent 1px),linear-gradient(90deg,var(--grout) 1px,transparent 1px);background-size:44px 44px;border-top:1px solid var(--grout);border-bottom:1px solid var(--grout)}
  .hero .wrap{display:grid;grid-template-columns:1.35fr 1fr;gap:48px;align-items:end;padding-top:70px;padding-bottom:80px}
  .sign h1{font-size:clamp(76px,15vw,184px);color:var(--brick);letter-spacing:-.02em;font-stretch:75%;margin-left:-4px;background:var(--white);display:inline-block;padding-right:12px}
  .sign .sub{font-size:clamp(22px,2.6vw,30px);font-weight:600;font-stretch:85%;margin:6px 0 18px;line-height:1.15;background:var(--white);display:inline-block;padding:2px 10px 2px 0}
  .sign p{color:var(--soft);margin-bottom:28px;background:var(--white);padding:4px 8px 4px 0}
  .btns{display:flex;gap:12px;flex-wrap:wrap}
  .btn{display:inline-block;font:inherit;font-weight:600;font-size:17px;padding:14px 22px;border-radius:3px;text-decoration:none;cursor:pointer;border:2px solid var(--ink)}
  .btn.main{background:var(--ink);color:var(--white)}
  .btn.main:hover{background:var(--brick);border-color:var(--brick)}
  .btn.line{background:var(--white)}
  .btn.line:hover{background:var(--ink);color:var(--white)}
  .board{background:var(--tile);color:var(--white);border-radius:6px;padding:28px 30px;box-shadow:0 0 0 6px var(--white),0 0 0 7px var(--grout)}
  .now{display:flex;align-items:center;gap:10px;font-size:21px;font-weight:600;margin-bottom:18px;line-height:1.25}
  .dot{width:12px;height:12px;border-radius:50%;background:#7FD1A0;flex:none}
  .now.closed .dot{background:#E58B7F}
  .board dl{display:grid;grid-template-columns:1fr auto;row-gap:8px;font-size:17px}
  .board dt{opacity:.75}
  .board dd{font-weight:600;font-variant-numeric:tabular-nums}
  .board .addr{border-top:1px solid rgba(237,241,239,.25);margin-top:18px;padding-top:16px;font-size:16px;opacity:.85}
  section{padding:96px 0}
  .menu{display:grid;grid-template-columns:1fr 1fr;column-gap:64px}
  .item{display:flex;align-items:baseline;gap:10px;padding:16px 0;border-bottom:1px solid var(--grout)}
  .item b{font-weight:600;font-size:20px}
  .item small{display:block;color:var(--soft);font-size:15px}
  .item .lead{flex:1;border-bottom:2px dotted var(--grout);transform:translateY(-6px);min-width:20px}
  .item .pr{font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;font-stretch:80%}
  .note{margin-top:22px;color:var(--soft);font-size:16px}
  .team{background:var(--tile);color:var(--white)}
  .people{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(237,241,239,.3)}
  .person{padding:26px 22px 8px 0}
  .person+.person{padding-left:22px;border-left:1px solid rgba(237,241,239,.3)}
  .person h3{font-size:34px;margin-bottom:6px}
  .person p{opacity:.8;font-size:16px}
  .person .yrs{display:block;margin-top:14px;font-weight:600}
  .shots{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:220px 220px;gap:14px}
  .shot{background:var(--grout);border-radius:4px;display:flex;align-items:flex-end;padding:14px;font-size:15px;color:var(--soft)}
  .shot:first-child{grid-row:span 2}
  .shots-note{margin-top:14px;font-size:15px;color:var(--soft)}
  .quotes{display:grid;grid-template-columns:repeat(3,1fr);gap:40px}
  blockquote{font-size:21px;line-height:1.4;font-weight:600;font-stretch:90%}
  blockquote footer{font-size:15px;font-weight:400;color:var(--soft);margin-top:12px}
  .faq{max-width:780px}
  .faq details{border-top:1px solid var(--grout)}
  .faq details:last-child{border-bottom:1px solid var(--grout)}
  .faq summary{cursor:pointer;padding:20px 0;font-weight:600;font-size:20px;list-style:none;display:flex;justify-content:space-between;gap:20px}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary::after{content:"+";font-weight:400;font-size:26px;line-height:.9;color:var(--brick)}
  .faq details[open] summary::after{content:"−"}
  .faq details p{padding:0 0 22px;color:var(--soft)}
  .book{background:#E2E8E6;border-top:1px solid var(--grout)}
  .book .wrap{display:grid;grid-template-columns:1fr 1fr;gap:56px}
  .lead-text{color:var(--soft);margin-bottom:24px}
  .contacts p{margin-bottom:8px}
  .contacts a{font-weight:600}
  .map{width:100%;height:240px;border:0;border-radius:4px;margin-top:22px;filter:grayscale(.6)}
  form{display:grid;gap:14px;align-content:start}
  label{font-size:15px;font-weight:600;display:grid;gap:6px}
  input,select{font:inherit;font-size:17px;padding:13px 14px;border:2px solid var(--grout);border-radius:3px;background:var(--white);color:var(--ink)}
  input:focus,select:focus{border-color:var(--tile);outline:none}
  form .btn{margin-top:6px;width:100%}
  .small{font-size:14px;color:var(--soft)}
  .foot{padding:30px 0;font-size:15px;color:var(--soft)}
  .foot .wrap{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
  .mbar{display:none}
  @media(max-width:860px){
    .top nav{display:none}
    .hero .wrap{grid-template-columns:1fr;padding-top:40px;padding-bottom:56px}
    .menu{grid-template-columns:1fr}
    .people{grid-template-columns:1fr 1fr}
    .person:nth-child(3){padding-left:0;border-left:0}
    .quotes{grid-template-columns:1fr}
    .shots{grid-template-columns:1fr 1fr;grid-template-rows:200px 160px 160px}
    .shot:first-child{grid-column:span 2;grid-row:auto}
    .book .wrap{grid-template-columns:1fr}
    section{padding:68px 0}
    .mbar{display:flex;gap:10px;position:fixed;left:0;right:0;bottom:0;z-index:5;padding:10px 12px;background:var(--white);border-top:1px solid var(--grout)}
    .mbar .btn{flex:1;text-align:center;padding:12px}
    body{padding-bottom:74px}
  }
</style>
<style>.page{padding:60px 0 100px;min-height:70vh}.crumbs{font-size:13px;color:var(--muted);margin-bottom:30px}.crumbs a{color:var(--tile)}
.page h1{font-size:clamp(36px,6vw,64px);margin-bottom:20px}.page p,.page li{color:var(--muted);margin-bottom:14px;max-width:700px}.page h2{font-size:22px;margin:30px 0 10px}.page ul{padding-left:20px}</style>
