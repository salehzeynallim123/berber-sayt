<!DOCTYPE html>
<html lang="az"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Səhifə tapılmadı — Ustad Barber</title><meta name="description" content="Səhifə tapılmadı — Ustad Barber, Bakı."><meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f0e0d;--card:#1a1816;--gold:#c9a45c;--text:#efe9df;--muted:#a59d90;--line:#2c2925}
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1100px;margin:0 auto;padding:0 20px}
  h1,h2,h3{font-family:Oswald,sans-serif;text-transform:uppercase;letter-spacing:.04em}
  /* nav */
  nav{position:sticky;top:0;z-index:10;background:rgba(15,14,13,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
  .logo{font-family:Oswald;font-size:22px;font-weight:700;letter-spacing:.08em}
  .logo span{color:var(--gold)}
  .links{display:flex;gap:28px;font-size:14px;color:var(--muted)}
  .links a:hover{color:var(--gold)}
  .btn{display:inline-block;background:var(--gold);color:#111;font-weight:600;padding:12px 24px;border-radius:4px;transition:.2s}
  .btn:hover{background:#e0bb72}
  .btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--gold);color:var(--gold)}
  /* hero */
  .hero{min-height:88vh;display:flex;align-items:center;position:relative;overflow:hidden;
    background:radial-gradient(ellipse at 75% 40%,rgba(201,164,92,.18),transparent 55%),
    repeating-linear-gradient(135deg,transparent 0 40px,rgba(255,255,255,.015) 40px 41px)}
  .hero .tag{color:var(--gold);font-size:13px;letter-spacing:.25em;text-transform:uppercase;margin-bottom:18px}
  .hero h1{font-size:clamp(44px,8vw,92px);line-height:1;margin-bottom:22px}
  .hero h1 em{font-style:normal;color:var(--gold)}
  .hero p{max-width:520px;color:var(--muted);font-size:18px;margin-bottom:34px}
  .hero .cta{display:flex;gap:14px;flex-wrap:wrap}
  .pole{position:absolute;right:8%;top:50%;transform:translateY(-50%);width:70px;height:340px;border-radius:35px;border:3px solid var(--gold);overflow:hidden}
  .pole::before{content:"";position:absolute;inset:-100% 0 0;background:repeating-linear-gradient(-45deg,#b33 0 22px,#efe9df 22px 44px,#2a4d8f 44px 66px,#efe9df 66px 88px);animation:spin 3s linear infinite}
  @keyframes spin{to{transform:translateY(50%)}}
  /* sections */
  section{padding:96px 0}
  .head{text-align:center;margin-bottom:56px}
  .head small{color:var(--gold);letter-spacing:.25em;font-size:12px;text-transform:uppercase}
  .head h2{font-size:clamp(32px,5vw,48px);margin-top:8px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .stats div{padding:34px;text-align:center}
  .stats div+div{border-left:1px solid var(--line)}
  .stats b{display:block;font-family:Oswald;font-size:40px;color:var(--gold)}
  .stats span{color:var(--muted);font-size:14px}
  /* prices */
  .prices{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px}
  .price{background:var(--card);border:1px solid var(--line);padding:26px 28px;border-radius:6px;display:flex;justify-content:space-between;gap:16px;transition:.2s}
  .price:hover{border-color:var(--gold);transform:translateY(-3px)}
  .price h3{font-size:19px;margin-bottom:4px}
  .price p{color:var(--muted);font-size:14px}
  .price b{font-family:Oswald;font-size:26px;color:var(--gold);white-space:nowrap}
  /* team */
  .team{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}
  .member{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden;text-align:center}
  .avatar{height:200px;display:flex;align-items:center;justify-content:center;font-family:Oswald;font-size:64px;color:var(--gold);
    background:linear-gradient(160deg,#2a2622,#141210)}
  .member h3{font-size:20px;margin:18px 0 2px}
  .member p{color:var(--muted);font-size:14px;margin-bottom:20px}
  /* reviews */
  .reviews{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
  .review{background:var(--card);border-left:3px solid var(--gold);padding:26px;border-radius:4px}
  .review .stars{color:var(--gold);letter-spacing:3px;margin-bottom:10px}
  .review p{color:var(--muted);margin-bottom:14px}
  .review b{font-size:14px}
  /* booking */
  .book{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
  .info p{color:var(--muted);margin-bottom:18px}
  .info .row{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .info .row b{color:var(--gold);min-width:90px;font-weight:500}
  form{background:var(--card);border:1px solid var(--line);padding:30px;border-radius:6px;display:grid;gap:14px}
  input,select{width:100%;background:#0f0e0d;border:1px solid var(--line);color:var(--text);padding:13px 14px;border-radius:4px;font:inherit}
  input:focus,select:focus{outline:none;border-color:var(--gold)}
  form .btn{border:none;cursor:pointer;font:inherit;font-weight:600}
  .ok{display:none;color:var(--gold);text-align:center}
  footer{border-top:1px solid var(--line);padding:30px 0;text-align:center;color:var(--muted);font-size:13px}
  .wa{position:fixed;right:20px;bottom:20px;width:58px;height:58px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(0,0,0,.4)}
  @media(max-width:760px){
    .links{display:none}.pole{display:none}
    .book{grid-template-columns:1fr}
    .stats{grid-template-columns:1fr}.stats div+div{border-left:none;border-top:1px solid var(--line)}
    section{padding:70px 0}
  }
  .gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
  .gallery figure{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .gallery .ph{height:220px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;text-align:center;padding:20px;
    background:repeating-linear-gradient(45deg,#1a1816 0 12px,#1e1c19 12px 24px)}
  .gallery figcaption{padding:12px 16px;font-size:14px;color:var(--muted)}
  .faq{max-width:760px;margin:0 auto}
  .faq details{border-bottom:1px solid var(--line);padding:18px 0}
  .faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
  .faq summary::after{content:"+";color:var(--gold);font-size:22px;line-height:1}
  .faq details[open] summary::after{content:"−"}
  .faq p{color:var(--muted);margin-top:10px}
  .map{width:100%;height:260px;border:1px solid var(--line);border-radius:6px;margin-top:22px;filter:grayscale(1) invert(.9) contrast(.9)}
  .promise{display:inline-block;background:rgba(201,164,92,.12);color:var(--gold);padding:6px 12px;border-radius:4px;font-size:13px;margin-bottom:18px}
  .mbar{display:none}
  footer a{color:var(--gold)}
  @media(max-width:760px){
    .mbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--bg);border-top:1px solid var(--line);padding:10px;gap:10px}
    .mbar a{flex:1;text-align:center}
    .wa{display:none}
    body{padding-bottom:70px}
  }
</style>
<style>.page{padding:60px 0 100px;min-height:70vh}.crumbs{font-size:13px;color:var(--muted);margin-bottom:30px}.crumbs a{color:var(--gold)}
.page h1{font-size:clamp(36px,6vw,64px);margin-bottom:20px}.page p,.page li{color:var(--muted);margin-bottom:14px;max-width:700px}.page h2{font-size:22px;margin:30px 0 10px}.page ul{padding-left:20px}</style>
</head><body><nav><div class="wrap"><a href="./" class="logo">USTAD<span>.</span>BARBER</a><a href="./#elaqe" class="btn">Növbə al</a></div></nav>
